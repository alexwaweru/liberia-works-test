## DigitalOcean App Platform — STAGING
##
## Mirrors .do/app.yaml but builds from the `staging` branch and uses cheaper
## tiers / dev databases. Create the `staging` branch in GitHub before applying:
##   git checkout -b staging && git push -u origin staging
##
## Apply:
##   doctl apps create --spec .do/app.staging.yaml

name: liberiaworks-staging
region: fra

databases:
  - name: db
    engine: PG
    version: "16"
    production: false                # dev tier — cheaper, no HA
    cluster_name: liberiaworks-staging-db

  - name: redis
    engine: REDIS
    production: false
    cluster_name: liberiaworks-staging-redis

jobs:
  # Runs once per deploy, before the new revision goes live. Chained:
  #   1. migrate deploy — apply any new Prisma migrations
  #   2. db:seed         — ISCED education levels, ISIC sectors, ISCO occupations
  #                        (idempotent via prisma.upsert by natural code)
  #   3. db:seed:locations — countries / regions / subregions / states / cities
  #                          (idempotent via INSERT ... ON CONFLICT (id) DO UPDATE)
  # Test fixtures (db:seed:test) are intentionally NOT run here.
  - name: migrate-and-seed
    kind: PRE_DEPLOY
    dockerfile_path: apps/api/Dockerfile
    github:
      repo: nyamu5/liberiaworks-monolith
      branch: staging
    run_command: |
      pnpm exec prisma migrate deploy && \
      pnpm exec tsx prisma/seed.ts && \
      pnpm exec tsx prisma/seed-locations.ts
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

services:
  - name: api
    dockerfile_path: apps/api/Dockerfile
    github:
      repo: nyamu5/liberiaworks-monolith
      branch: staging
      deploy_on_push: true
    http_port: 3001
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 10
      failure_threshold: 3
    routes:
      - path: /api
        preserve_path_prefix: true
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.DATABASE_URL}
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: JWT_ACCESS_EXPIRES_IN
        scope: RUN_TIME
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        scope: RUN_TIME
        value: "30d"
      - key: WEB_APP_URL
        scope: RUN_TIME
        value: ${web.PUBLIC_URL}
      - key: ALLOWED_ORIGINS
        scope: RUN_TIME
        value: ${web.PUBLIC_URL}
      - key: AT_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: AT_USERNAME
        scope: RUN_TIME
      - key: AT_SENDER_ID
        scope: RUN_TIME
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET

  - name: web
    dockerfile_path: apps/web/Dockerfile
    github:
      repo: nyamu5/liberiaworks-monolith
      branch: staging
      deploy_on_push: true
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}
      - key: API_URL
        scope: RUN_TIME
        value: ${api.PRIVATE_URL}

workers:
  - name: workers
    dockerfile_path: apps/api/Dockerfile
    github:
      repo: nyamu5/liberiaworks-monolith
      branch: staging
      deploy_on_push: true
    run_command: node dist/workers/index.js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.DATABASE_URL}
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: AT_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: AT_USERNAME
        scope: RUN_TIME
      - key: AT_SENDER_ID
        scope: RUN_TIME
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
