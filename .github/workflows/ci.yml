name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same branch so stale jobs don't eat minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint · Typecheck · Test ──────────────────────────────────────────────────
  # Turbo runs build → lint/typecheck/test in a single job.
  # Warm path: pnpm store + .turbo cache restore makes this ~60-80s.
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Version comes from "packageManager": "pnpm@9.15.4" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm' # Caches ~/.pnpm-store keyed on pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Turbo task cache — keyed on commit so each push writes a fresh entry,
      # but prior-branch entries are restored via the prefix restore-key.
      # For cross-PR warm cache, set TURBO_TOKEN + TURBO_TEAM (Vercel Remote Cache).
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build · Lint · Typecheck · Test
        run: pnpm turbo build lint typecheck test --cache-dir=.turbo

  # ── Migration drift ──────────────────────────────────────────────────────────
  # Fails if schema.prisma was edited without a corresponding migration file.
  # Requires the developer to run: pnpm --filter @liberia-works/api exec prisma migrate dev
  migration-diff:
    name: Migration drift
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgis/postgis has PostGIS pre-installed; pgvector is added below via docker exec.
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install pgvector in postgres container
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c \
            "apt-get update -qq && apt-get install -y --no-install-recommends postgresql-16-pgvector"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Check for migration drift
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/shadow
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code
